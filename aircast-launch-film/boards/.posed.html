<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- The frozen AirCast snapshot and the deterministic wind (no fetching while rendering). -->
    <script src="assets/js/aircast-data.js"></script>
    <script src="assets/js/wind.js"></script>
    <style>
      /* AirCast's own font files, taken from the live site by the capture. */
      @font-face {
        font-family: 'AirInter';
        src: url('assets/fonts/inter-latin.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'AirInter';
        src: url('assets/fonts/inter-latin-ext.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* The site's dark theme. Yellow is the one accent: Grensás's level, Moderate. */
      :root {
        --ground: #0d1620;
        --header-a: #060f19;
        --header-b: #0d2a45;
        --ink: #e8eef4;
        --muted: #a8b7c6;
        --light-ground: #f2f5f8;
        --light-ink: #10202f;
        --light-muted: #4a5a6a;
        --moderate: #f0e641;
        --font: 'AirInter', 'Inter', sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font);
      }
      /* Shared by the shots: the camera over the captured site, titles, the cursor. */
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        transform-origin: 0 0;
      }
      .cam img.plate {
        display: block;
        width: 1920px;
      }
      .title {
        position: absolute;
        color: var(--ink);
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .wind {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-two-sources.html" data-start="4" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-together.html" data-start="8.6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-pick.html" data-start="11.6" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-why.html" data-start="17.6" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-wind.html" data-start="24.6" data-duration="5.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7-claim.html" data-start="30" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s8" data-composition-id="s8" data-composition-src="compositions/s8-end.html" data-start="35" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- The voice (Kokoro "Heart", made on this computer with hyperframes tts). It is the clock:
           each scene starts on the line that names it. Times from the pauses in each file. -->
      <audio id="vo1" class="clip" src="assets/voice/v1.wav" data-start="0.4" data-duration="2.56" data-track-index="2"></audio>
      <audio id="vo2" class="clip" src="assets/voice/v2.wav" data-start="4.3" data-duration="3.82" data-track-index="2"></audio>
      <audio id="vo3" class="clip" src="assets/voice/v3.wav" data-start="8.8" data-duration="2.75" data-track-index="2"></audio>
      <audio id="vo4" class="clip" src="assets/voice/v4.wav" data-start="12.1" data-duration="4.1" data-track-index="2"></audio>
      <audio id="vo5" class="clip" src="assets/voice/v5.wav" data-start="17.7" data-duration="4.52" data-track-index="2"></audio>
      <audio id="vo6" class="clip" src="assets/voice/v6.wav" data-start="24.8" data-duration="4.54" data-track-index="2"></audio>
      <audio id="vo7" class="clip" src="assets/voice/v7.wav" data-start="30.6" data-duration="1.81" data-track-index="2"></audio>
      <audio id="vo8" class="clip" src="assets/voice/v8.wav" data-start="35.6" data-duration="1.98" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
